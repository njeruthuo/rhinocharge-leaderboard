
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #rally-app {
    font-family: 'Inter', sans-serif;
    background: #0e0b08;
    min-height: 100vh;
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  #topo-bg {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(204,85,0,0.04) 38px, rgba(204,85,0,0.04) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(204,85,0,0.04) 38px, rgba(204,85,0,0.04) 39px),
      radial-gradient(ellipse 80% 60% at 50% 20%, rgba(204,85,0,0.07) 0%, transparent 70%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
  }

  #tread-strip {
    position: absolute; bottom: 0; left: 0; right: 0; height: 6px; z-index: 0;
    background: repeating-linear-gradient(90deg, #CC5500 0px, #CC5500 12px, transparent 12px, transparent 18px);
    opacity: 0.5;
  }

  .rally-inner {
    position: relative; z-index: 1;
    max-width: 860px; margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .rally-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }

  .rally-title-block {}
  .rally-event { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 3px; color: #CC5500; text-transform: uppercase; margin-bottom: 2px; }
  .rally-title { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: #f5e6d0; letter-spacing: 1px; line-height: 1.1; }
  .rally-sub { font-size: 12px; color: #8a7060; margin-top: 4px; letter-spacing: 0.5px; }

  .live-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(204,85,0,0.12); border: 1px solid rgba(204,85,0,0.3);
    border-radius: 6px; padding: 6px 14px;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #CC5500;
    animation: pulse-dot 1.4s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(204,85,0,0.5); }
    50% { opacity: 0.85; transform: scale(1.15); box-shadow: 0 0 0 4px rgba(204,85,0,0); }
  }
  .live-text { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; color: #CC5500; letter-spacing: 2px; }

  .controls {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
  }

  .stage-label { font-size: 12px; color: #8a7060; flex: 1; min-width: 100px; }
  .stage-label span { color: #CC5500; font-weight: 600; }

  .shuffle-btn {
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
    background: transparent; border: 1px solid #CC5500; color: #CC5500;
    padding: 8px 20px; border-radius: 4px; cursor: pointer;
    text-transform: uppercase; transition: background 0.15s, color 0.15s;
  }
  .shuffle-btn:hover { background: #CC5500; color: #0e0b08; }
  .shuffle-btn:active { opacity: 0.8; transform: scale(0.97); }

  .col-headers {
    display: grid;
    grid-template-columns: 40px 1fr 130px 110px 90px;
    gap: 0 8px;
    padding: 0 14px 6px 54px;
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: #6b5c50;
    text-transform: uppercase;
  }

  .leaderboard { display: flex; flex-direction: column; gap: 6px; }

  .driver-row {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    border-left: 4px solid var(--accent);
  }
  .driver-row:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.14);
    animation: engine-idle 0.5s ease-in-out;
  }
  @keyframes engine-idle {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-1px); }
    40% { transform: translateX(1px); }
    60% { transform: translateX(-0.5px); }
    80% { transform: translateX(0.5px); }
  }

  .row-main {
    display: grid;
    grid-template-columns: 40px 1fr 130px 110px 90px;
    gap: 0 8px;
    align-items: center;
    padding: 10px 14px 10px 12px;
  }

  .rank-block { display: flex; align-items: center; gap: 8px; }
  .rank-num {
    font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700;
    color: #f5e6d0; line-height: 1; min-width: 28px; text-align: center;
  }
  .rank-1 .rank-num { color: #FFD700; }
  .rank-2 .rank-num { color: #C0C0C0; }
  .rank-3 .rank-num { color: #CD7F32; }

  .driver-info {}
  .driver-name {
    font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600;
    color: #f5e6d0; line-height: 1.1; letter-spacing: 0.3px;
  }
  .driver-nationality { font-size: 11px; color: #7a6a5a; margin-top: 1px; letter-spacing: 0.5px; }

  .car-name { font-size: 12px; color: #9a8070; letter-spacing: 0.3px; }
  .total-time {
    font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600;
    color: #e0d0c0; letter-spacing: 0.5px; text-align: right;
  }
  .gap-cell { text-align: right; }
  .gap-text {
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 400;
    color: #9a8070;
  }
  .gap-leader { color: #CC5500; font-weight: 600; font-size: 11px; letter-spacing: 1px; }

  .live-indicator {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(204,85,0,0.15); border-radius: 3px;
    padding: 2px 6px; margin-top: 3px;
  }
  .live-pip { width: 5px; height: 5px; border-radius: 50%; background: #CC5500; animation: pulse-dot 1.2s ease-in-out infinite; }
  .live-tag { font-size: 9px; font-weight: 700; color: #CC5500; letter-spacing: 1.5px; }

  .expand-icon { font-size: 12px; color: #6b5c50; margin-left: 4px; display: inline-block; transition: transform 0.2s; }
  .driver-row.open .expand-icon { transform: rotate(180deg); }

  .detail-card {
    display: none;
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 16px 16px 16px 16px;
    background: rgba(0,0,0,0.25);
    animation: slideDown 0.2s ease;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .driver-row.open .detail-card { display: block; }

  .detail-inner { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 12px 16px; align-items: start; }

  .driver-photo {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, #3a2a1a, #1e1008);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  .split-times {}
  .split-label { font-size: 10px; letter-spacing: 1.5px; color: #6b5c50; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  .split-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .split-name { font-size: 11px; color: #9a8070; }
  .split-val { font-family: 'Oswald', sans-serif; font-size: 13px; color: #e0d0c0; }
  .split-best { color: #4CAF50; }

  .sponsors {}
  .sponsor-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .sponsor-pill {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 3px;
    background: rgba(255,255,255,0.06); color: #8a7a6a;
    text-transform: uppercase; border: 1px solid rgba(255,255,255,0.08);
  }

  @media (max-width: 600px) {
    .col-headers { display: none; }
    .row-main { grid-template-columns: 36px 1fr auto; gap: 0 6px; }
    .car-name-col, .gap-cell { display: none; }
    .total-time { font-size: 13px; }
    .driver-name { font-size: 14px; }
    .detail-inner { grid-template-columns: 56px 1fr; }
    .sponsors { grid-column: 1 / -1; }
  }
</style>

<div id="rally-app">
  <div id="topo-bg"></div>
  <div id="tread-strip"></div>
  <div class="rally-inner">
    <div class="rally-header">
      <div class="rally-title-block">
        <div class="rally-event">WRC Season 2025 · Round 7</div>
        <div class="rally-title">Safari Rally Kenya</div>
        <div class="rally-sub">Naivasha Service Park — SS14 of 22</div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        <div class="live-text">Live</div>
      </div>
    </div>

    <div class="controls">
      <div class="stage-label">Overall standings after <span>SS14 – Sleeping Warrior</span></div>
      <button class="shuffle-btn" onclick="shuffleBoard()">⚡ Shuffle Stage</button>
    </div>

    <div class="col-headers">
      <div></div>
      <div>Driver</div>
      <div>Vehicle</div>
      <div style="text-align:right">Total Time</div>
      <div style="text-align:right">Gap</div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>
  </div>
</div>

<script>
const CLASS_COLORS = {
  'Rally1': '#CC5500',
  'Rally2': '#2196F3',
  'WRC2':   '#9C27B0',
};

const DRIVERS = [
  { id: 1, name: 'Kalle Rovanperä', nat: '🇫🇮 Finland', car: 'Toyota GR Yaris Rally1', class: 'Rally1',
    baseTime: 225840, live: true, initials: 'KR',
    sponsors: ['Red Bull', 'Toyota', 'Michelin', 'OMP'],
    splits: [{n:'SS13',v:'18:42.3', best:false},{n:'SS14',v:'19:04.1',best:true},{n:'SS12',v:'17:58.8',best:false}] },
  { id: 2, name: 'Sébastien Ogier', nat: '🇫🇷 France', car: 'Toyota GR Yaris Rally1', class: 'Rally1',
    baseTime: 226050, live: true, initials: 'SO',
    sponsors: ['Red Bull', 'Toyota', 'Michelin'],
    splits: [{n:'SS13',v:'18:44.8',best:false},{n:'SS14',v:'19:11.2',best:false},{n:'SS12',v:'18:03.1',best:false}] },
  { id: 3, name: 'Thierry Neuville', nat: '🇧🇪 Belgium', car: 'Hyundai i20 N Rally1', class: 'Rally1',
    baseTime: 226310, live: false, initials: 'TN',
    sponsors: ['Hyundai', 'Total', 'Sparco'],
    splits: [{n:'SS13',v:'18:49.5',best:false},{n:'SS14',v:'19:08.4',best:false},{n:'SS12',v:'18:14.0',best:false}] },
  { id: 4, name: 'Elfyn Evans', nat: '🏴󠁧󠁢󠁷󠁬󠁳󠁿 Wales', car: 'Toyota GR Yaris Rally1', class: 'Rally1',
    baseTime: 226680, live: true, initials: 'EE',
    sponsors: ['Toyota', 'Michelin', 'Sparco', 'Castrol'],
    splits: [{n:'SS13',v:'18:52.0',best:false},{n:'SS14',v:'19:16.5',best:false},{n:'SS12',v:'18:08.7',best:false}] },
  { id: 5, name: 'Ott Tänak', nat: '🇪🇪 Estonia', car: 'Hyundai i20 N Rally1', class: 'Rally1',
    baseTime: 226990, live: false, initials: 'OT',
    sponsors: ['Hyundai', 'Total', 'Neste'],
    splits: [{n:'SS13',v:'18:55.1',best:false},{n:'SS14',v:'19:22.0',best:false},{n:'SS12',v:'18:19.3',best:false}] },
  { id: 6, name: 'Adrien Fourmaux', nat: '🇫🇷 France', car: 'Ford Puma Rally1', class: 'Rally1',
    baseTime: 227400, live: true, initials: 'AF',
    sponsors: ['M-Sport', 'Ford', 'Pirelli'],
    splits: [{n:'SS13',v:'19:02.3',best:false},{n:'SS14',v:'19:28.8',best:false},{n:'SS12',v:'18:25.1',best:false}] },
  { id: 7, name: 'Grégoire Munster', nat: '🇱🇺 Luxembourg', car: 'Hyundai i20 N Rally1', class: 'Rally1',
    baseTime: 227910, live: false, initials: 'GM',
    sponsors: ['Hyundai', 'Total', 'OMP'],
    splits: [{n:'SS13',v:'19:08.7',best:false},{n:'SS14',v:'19:35.4',best:false},{n:'SS12',v:'18:30.0',best:false}] },
  { id: 8, name: 'Yohan Rossel', nat: '🇫🇷 France', car: 'Citroën C3 Rally2', class: 'Rally2',
    baseTime: 233200, live: true, initials: 'YR',
    sponsors: ['Citroën', 'Shell', 'Sabelt'],
    splits: [{n:'SS13',v:'19:40.2',best:false},{n:'SS14',v:'20:12.1',best:false},{n:'SS12',v:'18:58.4',best:false}] },
  { id: 9, name: 'Nikolay Gryazin', nat: '🇷🇸 Serbia', car: 'Škoda Fabia RS Rally2', class: 'WRC2',
    baseTime: 234100, live: false, initials: 'NG',
    sponsors: ['Škoda', 'Orlen', 'Nexen'],
    splits: [{n:'SS13',v:'19:48.5',best:false},{n:'SS14',v:'20:21.3',best:false},{n:'SS12',v:'19:04.7',best:false}] },
  { id: 10, name: 'Georg Linnamäe', nat: '🇪🇪 Estonia', car: 'Toyota GR Yaris Rally2', class: 'WRC2',
    baseTime: 235600, live: true, initials: 'GL',
    sponsors: ['Toyota', 'Michelin', 'Recaro'],
    splits: [{n:'SS13',v:'20:01.1',best:false},{n:'SS14',v:'20:38.9',best:false},{n:'SS12',v:'19:22.4',best:false}] },
];

let state = DRIVERS.map((d, i) => ({ ...d, time: d.baseTime + Math.floor(Math.random() * 100), rank: i + 1 }));
let openId = null;

function fmtTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const dec = Math.floor((ms % 1000) / 10);
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(dec).padStart(2,'0')}`;
}

function fmtGap(ms) {
  if (ms === 0) return null;
  const totalSec = ms / 1000;
  if (totalSec < 60) return `+${totalSec.toFixed(1)}s`;
  const m = Math.floor(totalSec / 60);
  const s = (totalSec % 60).toFixed(1);
  return `+${m}m ${s}s`;
}

function shuffleBoard() {
  state = state.map(d => ({
    ...d,
    time: d.baseTime + Math.floor(Math.random() * 18000) - 2000
  }));
  state.sort((a, b) => a.time - b.time);
  state = state.map((d, i) => ({ ...d, rank: i + 1 }));
  renderBoard();
}

function toggleRow(id) {
  openId = openId === id ? null : id;
  renderBoard();
}

function renderBoard() {
  const lb = document.getElementById('leaderboard');
  const leader = state[0].time;

  lb.innerHTML = state.map((d, i) => {
    const gap = d.time - leader;
    const accent = CLASS_COLORS[d.class] || '#CC5500';
    const isOpen = openId === d.id;
    const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';

    const splits = d.splits.map(s => `
      <div class="split-row">
        <span class="split-name">${s.n}</span>
        <span class="split-val ${s.best ? 'split-best' : ''}">${s.v}</span>
      </div>`).join('');

    const sponsorPills = d.sponsors.map(s => `<span class="sponsor-pill">${s}</span>`).join('');

    return `
    <div class="driver-row ${isOpen ? 'open' : ''} ${rankClass}" 
         style="--accent:${accent}" 
         onclick="toggleRow(${d.id})">
      <div class="row-main">
        <div class="rank-block">
          <div class="rank-num">${d.rank}</div>
        </div>
        <div class="driver-info">
          <div class="driver-name">${d.name} <span class="expand-icon">▾</span></div>
          <div class="driver-nationality">${d.nat}</div>
          ${d.live ? `<div class="live-indicator"><div class="live-pip"></div><span class="live-tag">On Stage</span></div>` : ''}
        </div>
        <div class="car-name-col car-name">${d.car}</div>
        <div class="total-time">${fmtTime(d.time)}</div>
        <div class="gap-cell">
          ${gap === 0 
            ? `<div class="gap-leader">LEADER</div>` 
            : `<div class="gap-text">${fmtGap(gap)}</div>`}
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-inner">
          <div class="driver-photo">${d.initials}</div>
          <div class="split-times">
            <div class="split-label">Stage splits</div>
            ${splits}
            <div style="font-size:11px;color:#6b5c50;margin-top:6px;">Vehicle: <span style="color:#9a8070">${d.car}</span></div>
            <div style="font-size:11px;color:#6b5c50;margin-top:2px;">Class: <span style="color:${accent};font-weight:600">${d.class}</span></div>
          </div>
          <div class="sponsors">
            <div class="split-label">Sponsors</div>
            <div class="sponsor-grid">${sponsorPills}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

renderBoard();
</script>
